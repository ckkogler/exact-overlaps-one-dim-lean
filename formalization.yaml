status:
  scope: >-
    The selected development comprises all seventeen numbered primary results,
    Definition 3.5, necessary supporting inputs and full Hochman Theorem 1.4.
    All seventeen results and the full Hochman input have compiled and received
    independent agent review. The complete stopped-block embedding includes
    actual bounded starts, ordering, independence and the exact joint law.
    The full default build and complete authored-declaration axiom audit have
    passed. Strict comparison of all eight Challenge claims and actual Lean,
    NanoDa and con-ron kernel checks have passed. A separate isolated Git
    checkout freshly rebuilt all 592 proof modules and passed the same
    3,622-declaration audit against the exact 598-file proof/configuration
    snapshot and nine pinned dependencies. Final public-commit recovery is
    checked separately.
    Challenge states two main theorems and a corollary, with preliminary
    entropy subadditivity and its ordinary rate limit, and three proved elementary
    normalization and support lemmas needed by the definitions. All eight
    Challenge theorem declarations are compared. Its five intentional holes are excluded from the proved
    Solution and from the following proved-development sorry count.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
automation:
  methods:
    - method: agent
      models: [GPT-6 (Codex)]
      framework: Codex
      tool_setup: >-
        A coordinator and three concurrent proof agents developed Lean proofs
        with compiler feedback, Mathlib tactics, exact-source axiom audits and
        cross-agent semantic review. Lean compilation used a Slurm CPU allocation.
        No unchecked proof certificate is used.
      prompting_notes: >-
        Preserve the formal source statements, constants and generality; prove
        necessary external inputs; document mathematical discrepancies; exclude
        informal remarks as separate targets; and prepare a self-contained
        local submission without publishing it.
  notes: >-
    Constantin Kogler supplied the mathematical source, direction and scope and
    is responsible for the formalization. Codex authored and revised Lean proofs
    and verification tooling. The mathematical source proofs are attributed to
    their named human authors. No claim of independent human review is made.
    Model-inference costs and aggregate inference time were not reliably measured.
fidelity:
  divergences: >-
    The statements use standard lower Hausdorff dimension, with exact
    dimensionality and its identification proved separately. The entropy rate
    is an explicit infimum, proved equal to the ordinary limit. Energy uses the
    extended nonnegative reals for general measures and is proved finite before
    real conversion for finite laws. The compact attractor is explicitly
    nonempty. Necessary atom, endpoint, counting and auxiliary entropy argument
    corrections are described in FORMALIZATION.md. No selected theorem is
    replaced by a conditional assumption or restricted to homogeneous,
    positive-ratio, algebraic or separated systems.
review:
  status: agent-reviewed
  reviewers: []
  notes: >-
    Distinct proof agents reviewed completed modules against the mathematical
    sources and actual Lean definitions, checking quantifiers, degeneracies,
    signed normalization, probability laws and dependencies. The coordinator
    reviewed integration and final mathematical statements. The full repository
    build, all-authored axiom audit, strict comparison and three kernel checks
    have passed on recorded source snapshots. A fresh isolated relocation
    build and axiom audit have also passed for the proof/configuration snapshot.
    Exact outcomes and scope are recorded in verification/; final public Git
    history and recovery-bundle readback are separate checks.
    No remote registry check, registration or human peer review is claimed.
