version: v0.4
project:
  name: The exact overlaps conjecture for self-similar measures on the real line
  description: >-
    For a probability measure supported on finitely many contracting real
    similarities, the dimension of its stationary measure is the minimum of
    one and the affine random-walk entropy rate divided by the absolute
    Lyapunov exponent. Ratios may be signed and unequal, parameters arbitrary
    real numbers, and listed weights zero. No separation condition is assumed.
    For a finite family without exact overlaps, the nonempty compact attractor
    has dimension min(1,s), where the sum of the absolute contraction ratios
    to the power s is one. An entropy inequality bounds the information lost
    under addition of m independent finitely supported real random variables
    by 30*m times the sum of their variance energies. Supporting results include
    exact dimensionality, Hochman's general conditional-entropy theorem,
    Gaussian approximation, entropy growth, and stopped-block estimates.
  authors: [Constantin Kogler]
  responsible_maintainers: [Constantin Kogler]
  license: 0BSD
classification:
  arxiv: [math.DS, math.PR, math.CA]
  msc2020: [28A80, 60G50]
sources:
  - title: The exact overlaps conjecture for self-similar measures on the real line
    authors: [Samuel Kittle, Constantin Kogler]
    type: paper
    relationship: formalizes
    location: Theorems 1.1 and 1.3, Corollaries 1.2 and 3.4, Lemmas 2.1–2.3, 3.1–3.2, 3.6–3.9 and 3.11, Propositions 3.3, 3.10 and 3.12, and Definition 3.5
    note: >-
      Primary mathematical source. Informal remarks and examples are not
      additional formalization targets. No public publication identifier is
      asserted for this manuscript. See COVERAGE.md and FORMALIZATION.md.
    license: The source work is not relicensed by the software license
  - title: On self-similar sets with overlaps and inverse theorems for entropy
    authors: [Michael Hochman]
    id: https://doi.org/10.4007/annals.2014.180.2.7
    type: paper
    relationship: formalizes
    location: Theorem 1.4 and the entropy-growth and dimension inputs required for it
    note: >-
      Annals of Mathematics 180 (2014), 773–822. The full general
      conditional-entropy conclusion and its application to primary Lemma 3.2
      are proved internally, with signed and unequal ratios. The development
      repairs auxiliary arguments while preserving the required conclusion.
  - title: Dimension theory of iterated function systems
    authors: [De-Jun Feng, Huyi Hu]
    type: paper
    relationship: independently-proves
    location: Exact dimensionality for the finite strictly contracting real systems used here
    note: >-
      Communications on Pure and Applied Mathematics 62 (2009), 1435–1500.
      The needed exact-dimensionality and entropy-dimension statements are
      proved in this repository. The full generality of this source is not claimed.
